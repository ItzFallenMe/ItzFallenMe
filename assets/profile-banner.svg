<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Vedant Yadav — student and developer</title>
  <desc id="desc">A dark blue gradient profile banner with the name Vedant Yadav and the words Student, Developer, Builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="55%" stop-color="#101d34"/>
      <stop offset="100%" stop-color="#123b70"/>
    </linearGradient>
